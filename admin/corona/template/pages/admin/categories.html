<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories Management - MOON PUNCH Admin</title>
  <link rel="stylesheet" href="../../assets/vendors/mdi/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="shortcut icon" href="../../assets/images/favicon.png" />
</head>
<body>
  <div class="container-scroller">
    <nav class="sidebar sidebar-offcanvas" id="sidebar">
      <div class="sidebar-brand-wrapper d-none d-lg-flex align-items-center justify-content-center fixed-top">
        <a class="sidebar-brand brand-logo" href="../../index.html"><img src="../../assets/images/logo.svg" alt="logo" /></a>
      </div>
      <ul class="nav" style="margin-top: 60px;">
        <li class="nav-item menu-items"><a class="nav-link" href="../../index.html"><span class="menu-icon"><i class="mdi mdi-speedometer"></i></span><span class="menu-title">Dashboard</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="users.html"><span class="menu-icon"><i class="mdi mdi-account-multiple"></i></span><span class="menu-title">Users</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="products.html"><span class="menu-icon"><i class="mdi mdi-package-variant"></i></span><span class="menu-title">Products</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="categories.html"><span class="menu-icon"><i class="mdi mdi-tag-multiple"></i></span><span class="menu-title">Categories</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="comments.html"><span class="menu-icon"><i class="mdi mdi-comment-multiple"></i></span><span class="menu-title">Comments</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="licenses.html"><span class="menu-icon"><i class="mdi mdi-license"></i></span><span class="menu-title">Licenses</span></a></li>
        <li class="nav-item menu-items"><a class="nav-link" href="subscribers.html"><span class="menu-icon"><i class="mdi mdi-email-multiple"></i></span><span class="menu-title">Subscribers</span></a></li>
      </ul>
    </nav>

    <div class="container-fluid page-body-wrapper">
      <nav class="navbar p-0 fixed-top d-flex flex-row">
        <div class="navbar-menu-wrapper flex-grow d-flex align-items-stretch">
          <button class="navbar-toggler navbar-toggler align-self-center" type="button" data-toggle="minimize"><span class="mdi mdi-menu"></span></button>
          <ul class="navbar-nav navbar-nav-right">
            <li class="nav-item dropdown"><a class="nav-link" id="profileDropdown" href="#" data-toggle="dropdown"><span class="nav-profile-name">Admin</span></a>
              <div class="dropdown-menu dropdown-menu-right navbar-dropdown"><a class="dropdown-item" href="#" id="logoutBtn"><i class="mdi mdi-logout text-danger"></i> Logout</a></div>
            </li>
          </ul>
        </div>
      </nav>

      <div class="main-panel">
        <div class="content-wrapper">
          <div class="page-header">
            <h3 class="page-title">Categories Management</h3>
            <nav aria-label="breadcrumb">
              <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="../../index.html">Dashboard</a></li>
                <li class="breadcrumb-item active" aria-current="page">Categories</li>
              </ol>
            </nav>
          </div>

          <div id="alertContainer"></div>

          <div class="row">
            <div class="col-lg-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <button class="btn btn-success mb-3" id="createCategoryBtn" data-toggle="modal" data-target="#categoryModal">+ Create Category</button>

                  <div class="table-responsive">
                    <table class="table table-striped" id="categoriesTable">
                      <thead>
                        <tr>
                          <th>Name</th>
                          <th>Slug</th>
                          <th>Color</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody id="categoriesTableBody">
                        <tr><td colspan="4" class="text-center">Loading...</td></tr>
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal fade" id="categoryModal" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Create Category</h5>
          <button type="button" class="close" data-dismiss="modal"><span>&times;</span></button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label>Name</label>
            <input type="text" id="catName" class="form-control" required>
          </div>
          <div class="form-group">
            <label>Slug</label>
            <input type="text" id="catSlug" class="form-control">
          </div>
          <div class="form-group">
            <label>Color (Hex)</label>
            <input type="color" id="catColor" class="form-control" style="height: 40px;">
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" id="saveCategoryBtn">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../../assets/vendors/js/vendor.bundle.base.js"></script>
  <script src="../../assets/js/off-canvas.js"></script>
  <script src="../../assets/js/tooltip.js"></script>
  <script src="../../assets/js/template.js"></script>
  <script>
    const Auth = {
      getToken: () => localStorage.getItem('mp_access_token'),
      clear: () => localStorage.removeItem('mp_access_token'),
      isLoggedIn: () => !!Auth.getToken(),
    };
  </script>
  <script src="../../api-admin.js"></script>
  <script>
    async function loadCategories() {
      try {
        const categories = await AdminAPI.getCategories();
        const tbody = document.getElementById('categoriesTableBody');
        tbody.innerHTML = '';

        if (!categories || categories.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center">No categories found</td></tr>';
          return;
        }

        categories.forEach(cat => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${cat.name}</td>
            <td>${cat.slug}</td>
            <td><span style="display:inline-block; width:30px; height:30px; background-color:${cat.colorHex}; border-radius:3px;"></span></td>
            <td>
              <button class="btn btn-sm btn-info" onclick="editCategory('${cat.id}')">Edit</button>
              <button class="btn btn-sm btn-danger" onclick="deleteCategory('${cat.id}')">Delete</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    async function saveCategory() {
      const data = {
        name: document.getElementById('catName').value,
        slug: document.getElementById('catSlug').value,
        colorHex: document.getElementById('catColor').value,
      };

      try {
        await AdminAPI.createCategory(data);
        showAlert('Category created', 'success');
        $('#categoryModal').modal('hide');
        document.getElementById('catName').value = '';
        document.getElementById('catSlug').value = '';
        loadCategories();
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    async function deleteCategory(catId) {
      if (!confirm('Are you sure?')) return;
      try {
        await AdminAPI.deleteCategory(catId);
        showAlert('Category deleted', 'success');
        loadCategories();
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    document.getElementById('saveCategoryBtn').addEventListener('click', saveCategory);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      Auth.clear();
      window.location.href = '../../index.html';
    });

    if (!Auth.isLoggedIn()) window.location.href = '../../index.html';
    loadCategories();
  </script>
</body>
</html>
