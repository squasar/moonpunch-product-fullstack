    <div class="container-fluid page-body-wrapper">

      <div class="main-panel">

          <div class="page-header">

          <div id="alertContainer"></div>

          <div class="row">
            <div class="col-lg-12 grid-margin stretch-card">
              <div class="card">
                <div class="card-body">
                  <h4 class="card-title">All Users</h4>
                  
                  <div class="row mb-3">
                    <div class="col-md-6">
                      <input type="text" id="searchInput" class="form-control" placeholder="Search users...">
                    </div>
                    <div class="col-md-3">
                      <select id="roleFilter" class="form-control">
                        <option value="">All Roles</option>
                        <option value="admin">Admin</option>
                        <option value="moderator">Moderator</option>
                        <option value="user">User</option>
                      </select>
                    </div>
                    <div class="col-md-3">
                      <button class="btn btn-primary w-100" id="searchBtn">Search</button>
                    </div>
                  </div>

                  <div class="table-responsive">
                    <table class="table table-striped" id="usersTable">
                      <thead>
                        <tr>
                          <th>Email</th>
                          <th>Username</th>
                          <th>Name</th>
                          <th>Role</th>
                          <th>Status</th>
                          <th>Last Login</th>
                          <th>Actions</th>
                        </tr>
                      </thead>
                      <tbody id="usersTableBody">
                        <tr><td colspan="7" class="text-center">Loading...</td></tr>
                      </tbody>
                    </table>
                  </div>

                  <div id="paginationContainer"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../../assets/vendors/js/vendor.bundle.base.js"></script>
  <script src="../../assets/js/off-canvas.js"></script>
  <script src="../../assets/js/tooltip.js"></script>
  <script src="../../assets/js/template.js"></script>
  <!-- Auth and Admin API Client -->
  <script>
    // Mock Auth object (in production, this would come from the main app)
    const Auth = {
      getToken: () => localStorage.getItem('mp_access_token'),
      setToken: (t) => localStorage.setItem('mp_access_token', t),
      clear: () => localStorage.removeItem('mp_access_token'),
      isLoggedIn: () => !!Auth.getToken(),
    };
  </script>
  <script src="../../api-admin.js"></script>
  <script>
    const currentPage = new URLSearchParams(window.location.search).get('page') || 1;
    const pageSize = 10;

    async function loadUsers() {
      try {
        const search = document.getElementById('searchInput').value;
        const role = document.getElementById('roleFilter').value;
        
        const response = await AdminAPI.getUsers(currentPage, pageSize, role || null, search || null);
        renderUsers(response);
      } catch (error) {
        showAlert('Error loading users: ' + error.message, 'danger');
      }
    }

    function renderUsers(data) {
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      if (!data.data || data.data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="text-center">No users found</td></tr>';
        return;
      }

      data.data.forEach(user => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${user.email}</td>
          <td>${user.username}</td>
          <td>${user.firstName || ''} ${user.lastName || ''}</td>
          <td><span class="badge badge-${user.role === 'admin' ? 'danger' : 'info'}">${user.role}</span></td>
          <td><span class="badge badge-${user.isActive ? 'success' : 'warning'}">${user.isActive ? 'Active' : 'Disabled'}</span></td>
          <td>${user.lastLoginAt ? formatDate(user.lastLoginAt) : 'Never'}</td>
          <td>
            <div class="action-buttons">
              <button class="btn btn-sm btn-warning" onclick="changeRole('${user.id}', '${user.role}')">Role</button>
              ${user.isActive ? `<button class="btn btn-sm btn-danger" onclick="disableUser('${user.id}')">Disable</button>` : ''}
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });

      // Pagination
      const pagination = document.getElementById('paginationContainer');
      pagination.innerHTML = getPaginationHTML(data.page, data.pages);
    }

    async function changeRole(userId, currentRole) {
      const roles = ['user', 'moderator', 'admin'];
      const newRole = prompt(`Select new role (current: ${currentRole}):\n${roles.join(', ')}`);
      
      if (!newRole || !roles.includes(newRole)) {
        return;
      }

      try {
        await AdminAPI.updateUserRole(userId, newRole);
        showAlert('Role updated successfully', 'success');
        loadUsers();
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    async function disableUser(userId) {
      if (!confirm('Are you sure you want to disable this user?')) {
        return;
      }

      try {
        await AdminAPI.disableUser(userId);
        showAlert('User disabled successfully', 'success');
        loadUsers();
      } catch (error) {
        showAlert('Error: ' + error.message, 'danger');
      }
    }

    document.getElementById('searchBtn').addEventListener('click', loadUsers);
    document.getElementById('logoutBtn').addEventListener('click', () => {
      Auth.clear();
      window.location.href = '../../index.html';
    });

    // Check auth
    if (!Auth.isLoggedIn()) {
      window.location.href = '../../index.html';
    }

    // Load users on page load
    loadUsers();
  </script>
</body>
</html>
